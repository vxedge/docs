<title id="t">vxedge topology: operator edge, one host with vxgateway, zones and central compute</title>
<desc id="d">A software gateway on one host trunks VLAN slices to zone controllers (QEMU/KVM, microVM or container) and to central compute containers; the operator edge, a 5G core and an emulated backhaul sit above. Solid boxes are built today; dashed boxes are specified and not built yet.</desc>
