<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">vxAPI layers: frontends, generated SDKs, vxAPI, vxedged and vxedge-core</title>
<desc id="d">Thin frontends call the vxAPI through generated SDKs. On the host, vxAPI fronts the vxedged daemon (job engine, event bus, reconciler, audit log), which sits on vxedge-core (manifests, validation and the libvirt, network, container, 5G and traffic backends). Solid boxes are built today; dashed boxes are specified and not built yet.</desc>
